<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>MKW Times</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg:#14161c; --panel:#1d2029; --line:#2b2f3b; --text:#e8eaf0; --dim:#8b91a1;
    --accent:#ffb627; --good:#4fd18b; --mid:#e8c547; --bad:#ef6b5b; --new:#ff4f8b;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text);
    font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .mono { font-family:ui-monospace,"Roboto Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }
  header { position:sticky; top:0; z-index:5; background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 10px) 12px 8px; border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; gap:8px; }
  h1 { font-size:18px; margin:0; flex:1; letter-spacing:.3px; }
  h1 span { color:var(--accent); }
  .iconbtn { background:none; border:1px solid var(--line); color:var(--text); border-radius:10px;
    width:36px; height:36px; font-size:17px; }
  .meta { color:var(--dim); font-size:12px; margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; }
  .meta b { color:var(--text); font-weight:600; }
  .banner { margin-top:8px; background:#3a1a27; border:1px solid var(--new); border-radius:10px;
    padding:8px 10px; font-size:13px; display:flex; align-items:center; gap:8px; }
  .banner button { margin-left:auto; }
  .row { display:flex; gap:6px; margin-top:8px; overflow-x:auto; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:1px solid var(--line); background:var(--panel); color:var(--dim);
    border-radius:999px; padding:6px 11px; font-size:13px; white-space:nowrap; }
  .chip.on { color:#14161c; background:var(--accent); border-color:var(--accent); font-weight:600; }
  .search { width:100%; margin-top:8px; background:var(--panel); border:1px solid var(--line);
    color:var(--text); border-radius:10px; padding:8px 10px; font-size:15px; }

  ul { list-style:none; margin:0; padding:0 0 calc(env(safe-area-inset-bottom) + 20px); }
  li { display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:10px 12px;
    border-bottom:1px solid var(--line); }
  li:active { background:var(--panel); }
  .name { font-weight:600; display:flex; align-items:center; gap:6px; min-width:0; }
  .name .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font-size:10px; font-weight:700; padding:1px 5px; border-radius:4px; flex:none; }
  .tag.dlc { background:#2c3550; color:#9fb4ff; }
  .tag.new { background:var(--new); color:#fff; }
  .sub { color:var(--dim); font-size:12.5px; }
  .right { text-align:right; grid-row:span 2; align-self:center; }
  .gap { font-size:15px; font-weight:600; }
  .pct { font-size:12.5px; }
  .none { color:var(--dim); font-size:13px; }
  .bar { grid-column:1 / -1; height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; }
  .empty { padding:40px 20px; text-align:center; color:var(--dim); }

  /* bottom sheet */
  .scrim { position:fixed; inset:0; background:#0009; z-index:10; display:none; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:11; background:var(--panel);
    border-radius:16px 16px 0 0; padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);
    max-height:88vh; overflow:auto; transform:translateY(105%); transition:transform .2s ease; }
  .open .scrim { display:block; } .open .sheet { transform:none; }
  .sheet h2 { margin:0 0 2px; font-size:18px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; margin:10px 0; }
  .kv dt { color:var(--dim); } .kv dd { margin:0; }
  .entry { display:flex; gap:8px; margin-top:10px; }
  .entry input { flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px; font-size:20px; letter-spacing:1px; }
  .btn { background:var(--accent); color:#14161c; border:0; border-radius:10px; padding:0 16px;
    font-weight:700; font-size:15px; }
  .btn.ghost { background:none; color:var(--text); border:1px solid var(--line); padding:8px 12px; font-weight:500; }
  .preview { font-size:13px; color:var(--dim); margin-top:6px; min-height:18px; }
  .hist { margin-top:12px; font-size:13.5px; }
  .hist div { display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid var(--line); }
  .hist button { background:none; border:0; color:var(--dim); font-size:15px; padding:0 4px; }
  .links { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .links a { color:var(--accent); font-size:14px; text-decoration:none; border:1px solid var(--line);
    padding:7px 11px; border-radius:10px; }
  .menu button { display:block; width:100%; text-align:left; margin-top:8px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#000d; color:#fff;
    padding:8px 14px; border-radius:10px; font-size:14px; z-index:20; display:none; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>MKW <span>Times</span></h1>
    <button class="iconbtn" id="refreshBtn" title="Refresh WRs">⟳</button>
    <button class="iconbtn" id="menuBtn" title="Menu">⋮</button>
  </div>
  <div class="meta" id="meta"></div>
  <div id="bannerWrap"></div>
  <div class="row" id="catChips"></div>
  <div class="row" id="sortChips"></div>
  <input class="search" id="search" placeholder="Filter tracks…" autocomplete="off">
</header>
<ul id="list"></ul>

<div id="sheetWrap">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
const KEY = 'mkw.v1';
const state = load();
let WR = null;           // { updated, tracks:[...] }
let openTrack = null;

function load() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  return Object.assign({
    times: {},            // track -> [{ms, date}]
    seen: {},             // track -> WR ms last acknowledged
    flags: {},            // track -> {oldMs, oldPlayer, at}
    cat: 'all', sort: 'n', dir: 1, timedOnly: false,
  }, s);
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- time helpers ---------- */
const fmt = ms => {
  if (ms == null) return '–';
  const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000), x = ms % 1000;
  return `${m}'${String(s).padStart(2,'0')}"${String(x).padStart(3,'0')}`;
};
const fmtPct = p => (p < 0 ? '−' : '+') + Math.abs(p).toFixed(2) + '%';
const fmtGap = ms => (ms < 0 ? '−' : '+') + (Math.abs(ms) / 1000).toFixed(3);
// digits only: last 3 = ms, next 2 = sec, rest = min.  "147342" -> 1'47"342
function parseTime(str) {
  const d = String(str).replace(/\D/g, '');
  if (d.length < 4) return null;
  const ms = +d.slice(-3), s = +d.slice(-5, -3), m = +(d.slice(0, -5) || 0);
  if (s > 59) return null;
  return m * 60000 + s * 1000 + ms;
}
const today = () => new Date().toLocaleDateString('en-CA');
const pb = t => { const h = state.times[t]; return h && h.length ? Math.min(...h.map(x => x.ms)) : null; };
const pbEntry = t => { const h = state.times[t] || []; return h.reduce((a, b) => (!a || b.ms < a.ms ? b : a), null); };
const pctColor = p => p == null ? 'var(--line)' : p < 3 ? 'var(--good)' : p < 8 ? 'var(--mid)' : 'var(--bad)';

/* ---------- data ---------- */
async function fetchWRs(manual) {
  try {
    const r = await fetch('wrs.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    WR = await r.json();
    localStorage.setItem(KEY + '.wrcache', JSON.stringify(WR));
    if (manual) toast('WRs up to date');
  } catch (e) {
    const c = localStorage.getItem(KEY + '.wrcache');
    if (c) WR = JSON.parse(c);
    toast('Offline – showing saved WRs');
  }
  detectNewWRs();
  render();
}

function detectNewWRs() {
  if (!WR) return;
  for (const t of WR.tracks) {
    const prev = state.seen[t.track];
    if (prev == null) { state.seen[t.track] = t.ms; continue; }   // first sighting: no flag
    if (t.ms !== prev) {
      if (!state.flags[t.track]) state.flags[t.track] = { oldMs: prev, at: today() };
      state.seen[t.track] = t.ms;
    }
  }
  save();
}

function rows() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = WR.tracks.map(t => {
    const mine = pb(t.track);
    const gap = mine == null ? null : mine - t.ms;
    return { ...t, mine, gap, pct: gap == null ? null : gap / t.ms * 100,
             pbDate: (pbEntry(t.track) || {}).date || '', flag: state.flags[t.track] };
  });
  if (state.cat === 'base' || state.cat === 'dlc') list = list.filter(r => r.cat === state.cat);
  if (state.cat === 'new') list = list.filter(r => r.flag);
  if (state.timedOnly) list = list.filter(r => r.mine != null);
  if (q) list = list.filter(r => r.track.toLowerCase().includes(q));
  const k = state.sort, d = state.dir;
  list.sort((a, b) => {
    if (k === 'n' || k === 'wrdate') {
      const av = k === 'n' ? a.n : a.date, bv = k === 'n' ? b.n : b.date;
      return (av < bv ? -1 : av > bv ? 1 : 0) * (k === 'wrdate' ? -d : d);
    }
    const av = k === 'pb' ? a.pbDate : a[k], bv = k === 'pb' ? b.pbDate : b[k];
    const an = av == null || av === '', bn = bv == null || bv === '';
    if (an || bn) return an - bn;                       // untimed always last
    return (av < bv ? -1 : av > bv ? 1 : 0) * (k === 'pb' ? -d : d);
  });
  return list;
}

/* ---------- render ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function render() {
  if (!WR) return;
  const all = WR.tracks;
  const timed = all.filter(t => pb(t.track) != null);
  const pcts = timed.map(t => (pb(t.track) - t.ms) / t.ms * 100).sort((a, b) => a - b);
  const med = pcts.length ? pcts[Math.floor((pcts.length - 1) / 2)] : null;
  const upd = WR.updated ? new Date(WR.updated).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : '?';
  document.getElementById('meta').innerHTML =
    `<span>Timed <b>${timed.length}/${all.length}</b></span>` +
    (med != null ? `<span>Median <b>${fmtPct(med)}</b></span>` : '') +
    (pcts.length ? `<span>Best <b>${fmtPct(pcts[0])}</b></span>` : '') +
    `<span>WRs checked ${upd}</span>`;

  const nFlags = Object.keys(state.flags).length;
  document.getElementById('bannerWrap').innerHTML = nFlags
    ? `<div class="banner"><span class="tag new">NEW</span> ${nFlags} WR${nFlags > 1 ? 's' : ''} changed since you last looked
       <button class="btn ghost" onclick="clearFlags()">Clear</button></div>` : '';

  const cats = [['all','All'],['base','Base 30'],['dlc','DLC'],...(nFlags ? [['new',`New WRs (${nFlags})`]] : [])];
  document.getElementById('catChips').innerHTML =
    cats.map(([k, l]) => `<button class="chip ${state.cat === k ? 'on' : ''}" onclick="setCat('${k}')">${l}</button>`).join('') +
    `<button class="chip ${state.timedOnly ? 'on' : ''}" onclick="toggleTimed()">Timed only</button>`;

  const sorts = [['n','Track #'],['gap','Gap'],['pct','Gap %'],['pb','Recent PB'],['wrdate','Recent WR']];
  document.getElementById('sortChips').innerHTML = sorts.map(([k, l]) =>
    `<button class="chip ${state.sort === k ? 'on' : ''}" onclick="setSort('${k}')">${l}${state.sort === k ? (state.dir > 0 ? ' ↑' : ' ↓') : ''}</button>`).join('');

  const list = rows();
  document.getElementById('list').innerHTML = list.length ? list.map(r => {
    const w = r.pct == null ? 0 : Math.max(4, 100 - Math.min(r.pct, 25) * 4);
    return `<li onclick="openSheet(${JSON.stringify(r.track).replace(/"/g, '&quot;')})">
      <div class="name"><span class="t">${esc(r.track)}</span>
        ${r.cat === 'dlc' ? '<span class="tag dlc">DLC</span>' : ''}${r.flag ? '<span class="tag new">NEW WR</span>' : ''}</div>
      <div class="right">${r.mine == null ? '<span class="none">tap to add</span>' :
        `<div class="gap mono">${fmtGap(r.gap)}</div><div class="pct mono" style="color:${pctColor(r.pct)}">${fmtPct(r.pct)}</div>`}</div>
      <div class="sub mono">WR ${r.time} · You ${fmt(r.mine)}</div>
      <div class="bar"><i style="width:${w}%;background:${pctColor(r.pct)}"></i></div>
    </li>`;
  }).join('') : `<div class="empty">No tracks match.</div>`;
}

/* ---------- actions ---------- */
function setCat(k) { state.cat = k; save(); render(); }
function toggleTimed() { state.timedOnly = !state.timedOnly; save(); render(); }
function setSort(k) {
  if (state.sort === k) state.dir *= -1; else { state.sort = k; state.dir = 1; }
  save(); render();
}
function clearFlags() { state.flags = {}; if (state.cat === 'new') state.cat = 'all'; save(); render(); }

function openSheet(track) {
  openTrack = track;
  const t = WR.tracks.find(x => x.track === track);
  const hist = (state.times[track] || []).slice().sort((a, b) => a.ms - b.ms);
  const mine = pb(track), flag = state.flags[track];
  document.getElementById('sheet').innerHTML = `
    <h2>${esc(t.track)}</h2>
    <div class="sub">${t.cat === 'dlc' ? 'DLC' : 'Base game'} · #${t.n}</div>
    ${flag ? `<div class="banner"><span class="tag new">NEW</span> WR improved from <span class="mono">${fmt(flag.oldMs)}</span>
       (−${((flag.oldMs - t.ms) / 1000).toFixed(3)}s)<button class="btn ghost" onclick="clearFlag()">OK</button></div>` : ''}
    <dl class="kv">
      <dt>WR</dt><dd class="mono"><b>${t.time}</b></dd>
      <dt>Player</dt><dd>${esc(t.player)} ${t.nation ? '· ' + esc(t.nation) : ''}</dd>
      <dt>Set</dt><dd>${esc(t.date)}</dd>
      <dt>Combo</dt><dd>${esc(t.character)} / ${esc(t.vehicle)}</dd>
      ${mine != null ? `<dt>Your PB</dt><dd class="mono">${fmt(mine)} &nbsp; ${fmtGap(mine - t.ms)} (${fmtPct(((mine - t.ms) / t.ms * 100))})</dd>` : ''}
    </dl>
    <div class="entry">
      <input id="timeIn" class="mono" inputmode="numeric" placeholder="e.g. 152430 → 1'52&quot;430" autocomplete="off">
      <button class="btn" onclick="addTime()">Save</button>
    </div>
    <div class="preview mono" id="preview"></div>
    ${hist.length ? `<div class="hist"><div class="sub" style="border:0">Your times</div>${hist.map(h =>
      `<div><span class="mono">${fmt(h.ms)} ${h.ms === mine ? '★' : ''}</span>
        <span class="sub">${esc(h.date)} <button onclick="delTime(${h.ms},'${h.date}')">✕</button></span></div>`).join('')}</div>` : ''}
    <div class="links">
      ${t.video ? `<a href="${esc(t.video)}" target="_blank" rel="noopener">▶ WR video</a>` : ''}
      <a href="${esc(t.url)}" target="_blank" rel="noopener">WR history ↗</a>
    </div>`;
  const inp = document.getElementById('timeIn');
  inp.addEventListener('input', () => {
    const ms = parseTime(inp.value), p = document.getElementById('preview');
    if (ms == null) { p.textContent = ''; return; }
    const g = ms - t.ms;
    p.innerHTML = `${fmt(ms)} &nbsp; ${fmtGap(g)} (${fmtPct((g / t.ms * 100))})` +
      (mine != null ? (ms < mine ? ` &nbsp; <span style="color:var(--good)">new PB (−${((mine - ms) / 1000).toFixed(3)})</span>` : ' &nbsp; not a PB') : '');
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') addTime(); });
  document.getElementById('sheetWrap').classList.add('open');
}
function closeSheet() { document.getElementById('sheetWrap').classList.remove('open'); openTrack = null; }
function addTime() {
  const ms = parseTime(document.getElementById('timeIn').value);
  if (ms == null) { toast('Type digits like 152430'); return; }
  const h = state.times[openTrack] = state.times[openTrack] || [];
  if (!h.some(x => x.ms === ms)) h.push({ ms, date: today() });
  save(); render(); openSheet(openTrack); toast('Saved ' + fmt(ms));
}
function delTime(ms, date) {
  if (!confirm('Delete ' + fmt(ms) + '?')) return;
  state.times[openTrack] = (state.times[openTrack] || []).filter(x => !(x.ms === ms && x.date === date));
  save(); render(); openSheet(openTrack);
}
function clearFlag() { delete state.flags[openTrack]; save(); render(); openSheet(openTrack); }

function openMenu() {
  document.getElementById('sheet').innerHTML = `<h2>Menu</h2><div class="menu">
    <button class="btn ghost" onclick="exportData()">⬇ Export backup (.json)</button>
    <button class="btn ghost" onclick="document.getElementById('importFile').click()">⬆ Import backup</button>
    <button class="btn ghost" onclick="exportCSV()">⬇ Export times as CSV</button>
    <a class="btn ghost" style="display:block;margin-top:8px;color:var(--text);text-decoration:none" href="https://mkwrs.com/mkworld/" target="_blank" rel="noopener">Open mkwrs.com ↗</a>
  </div><p class="sub" style="margin-top:14px">Your times live only on this phone. Export a backup now and then.</p>`;
  document.getElementById('sheetWrap').classList.add('open');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportData() {
  download(`mkw-times-${today()}.json`, JSON.stringify({ times: state.times, seen: state.seen, flags: state.flags }, null, 1), 'application/json');
}
function exportCSV() {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const lines = ['track,category,wr,your_pb,gap_s,gap_pct'];
  for (const t of WR.tracks) {
    const m = pb(t.track);
    lines.push([q(t.track), t.cat, q(t.time), m == null ? '' : q(fmt(m)),
      m == null ? '' : ((m - t.ms) / 1000).toFixed(3), m == null ? '' : ((m - t.ms) / t.ms * 100).toFixed(2)].join(','));
  }
  download(`mkw-times-${today()}.csv`, lines.join('\n'), 'text/csv');
}
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.times) throw 0;
    if (!confirm('Replace your current times with this backup?')) return;
    Object.assign(state, { times: d.times, seen: d.seen || state.seen, flags: d.flags || {} });
    save(); closeSheet(); render(); toast('Backup imported');
  } catch { toast('Not a valid backup file'); }
  e.target.value = '';
});

let toastT;
function toast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 1800);
}

document.getElementById('scrim').onclick = closeSheet;
document.getElementById('menuBtn').onclick = openMenu;
document.getElementById('refreshBtn').onclick = () => fetchWRs(true);
document.getElementById('search').addEventListener('input', render);
window.addEventListener('popstate', closeSheet);
document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchWRs(false); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
fetchWRs(false);
</script>
</body>
</html>
