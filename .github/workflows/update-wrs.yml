name: Update WRs

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python scripts/scrape.py
      - name: Commit if changed
        run: |
          if git diff --quiet wrs.json; then echo "No WR changes"; exit 0; fi
          git config user.name "wr-bot"
          git config user.email "wr-bot@users.noreply.github.com"
          git add wrs.json
          git commit -m "Update WRs"
          git push
